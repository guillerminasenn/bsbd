[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bpwave2"
version = "0.0.1"
description = "bpwave2 contains all code and references necessary to run the MH sampler on seiseismic data for wavelet estimation."
authors = [
  { name = "Guillermina Senn" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["bpwave2"]
force_sort_within_sections = true
